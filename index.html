<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BudgetBot | Conversational Tracker</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f1f5f9;
            --text: #0f172a;
            --bot-msg: #ffffff;
            --user-msg: #2563eb;
            --accent: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
            --food: #ef4444;
            --transport: #3b82f6;
            --entertainment: #a855f7;
            --shopping: #ec4899;
            --housing: #10b981;
            --misc: #64748b;
        }

        * { box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; height: 100vh; overflow: hidden; }

        #app {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            position: relative;
        }

        header {
            padding: 16px 20px;
            background: white;
            border-bottom: 1px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { margin: 0; font-size: 1.2rem; color: var(--primary); font-weight: 800; }
        
        #help-toggle {
            font-size: 0.8rem;
            color: var(--primary);
            cursor: pointer;
            text-decoration: underline;
        }

        #instructions-panel {
            display: none;
            padding: 15px 20px;
            background: #eff6ff;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--accent);
            line-height: 1.4;
        }

        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f8fafc;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            animation: slideUp 0.2s ease-out;
        }

        .bot { align-self: flex-start; background: var(--bot-msg); border: 1px solid var(--accent); border-bottom-left-radius: 2px; }
        .user { align-self: flex-end; background: var(--user-msg); color: white; border-bottom-right-radius: 2px; }

        .status-container { width: 100%; margin-top: 8px; }
        .progress-row { margin-bottom: 8px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; margin-bottom: 4px; text-transform: uppercase; }
        .progress-bar-bg { height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; }
        .progress-bar-fill { height: 100%; transition: width 0.5s ease; }

        #controls { padding: 15px; border-top: 1px solid var(--accent); background: white; }
        #suggestions { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
        #suggestions::-webkit-scrollbar { display: none; }
        .chip { 
            white-space: nowrap; background: var(--accent); padding: 6px 12px; border-radius: 20px; 
            font-size: 12px; cursor: pointer; transition: 0.2s; border: none;
        }
        .chip:hover { background: #cbd5e1; }

        form { display: flex; gap: 8px; }
        input { 
            flex: 1; padding: 12px; border: 1px solid var(--accent); border-radius: 8px; 
            outline: none; transition: 0.2s; font-size: 16px;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(37,99,235,0.1); }
        button { 
            background: var(--primary); color: white; border: none; padding: 0 16px; 
            border-radius: 8px; cursor: pointer; font-weight: 600;
        }
        button:hover { background: var(--primary-hover); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="app">
    <header>
        <h1>BudgetBot 🤖</h1>
        <span id="help-toggle" onclick="toggleHelp()">How to use?</span>
    </header>

    <div id="instructions-panel">
        <strong>Commands you can use:</strong><br>
        • "Coffee $5" or "Spent $20 on lunch"<br>
        • "Set food budget $300"<br>
        • "Status" or "Show breakdown"<br>
        • "Undo" to delete the last entry
    </div>

    <div id="chat-window"></div>
    
    <div id="controls">
        <div id="suggestions">
            <button class="chip" onclick="handleSuggest('Status')">📊 My Progress</button>
            <button class="chip" onclick="handleSuggest('Set monthly food budget $200')">🎯 Set Budget</button>
            <button class="chip" onclick="handleSuggest('Uber $15')">🚗 Log Transport</button>
            <button class="chip" onclick="handleSuggest('Undo')">↩️ Undo Last</button>
        </div>

        <form onsubmit="handleInput(event)">
            <input type="text" id="user-input" placeholder="Say something like 'Dinner $25'..." autocomplete="off">
            <button type="submit">Send</button>
        </form>
    </div>
</div>

<script>
    const CATEGORIES = {
        food:          { color: 'var(--food)',          keywords: ['lunch', 'dinner', 'coffee', 'groceries', 'eat', 'pizza', 'mcdonalds', 'drink', 'food', 'breakfast', 'snack', 'restaurant'] },
        transport:     { color: 'var(--transport)',     keywords: ['uber', 'gas', 'bus', 'train', 'taxi', 'lyft', 'parking', 'fuel', 'transport', 'subway', 'metro'] },
        entertainment: { color: 'var(--entertainment)', keywords: ['movies', 'netflix', 'concert', 'gaming', 'steam', 'bar', 'party', 'entertainment', 'spotify', 'hulu', 'disney'] },
        shopping:      { color: 'var(--shopping)',      keywords: ['amazon', 'clothes', 'shoes', 'gift', 'mall', 'target', 'store', 'shopping', 'walmart', 'purchase'] },
        housing:       { color: 'var(--housing)',       keywords: ['rent', 'electric', 'water', 'wifi', 'utility', 'bill', 'housing', 'mortgage', 'internet', 'phone'] },
        misc:          { color: 'var(--misc)',          keywords: [] }
    };

    // ─── NEW: single source of truth for category detection ──────────────────
    // Checks keywords for every category in definition order.
    // Falls back to 'misc' if nothing matches.
    function detectCategory(input) {
        for (const [cat, data] of Object.entries(CATEGORIES)) {
            if (cat === 'misc') continue; // skip misc — it's the fallback, not a match
            if (data.keywords.some(k => input.includes(k))) {
                return cat;
            }
        }
        return 'misc';
    }
    // ─────────────────────────────────────────────────────────────────────────

    let state = JSON.parse(localStorage.getItem('budgetBot_v4')) || {
        expenses: [],
        budgets: {}
    };

    function save() { localStorage.setItem('budgetBot_v4', JSON.stringify(state)); }

    function toggleHelp() {
        const panel = document.getElementById('instructions-panel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    function parseInput(text) {
        const input = text.toLowerCase();
        
        if (input === 'undo' || input.includes('remove last')) return { intent: 'UNDO' };

        if (input.includes('status') || input.includes('show') || input.includes('breakdown') || input.includes('summary')) {
            return { intent: 'SUMMARY' };
        }

        const amountMatch = input.match(/\$?\d+(\.\d{1,2})?/);
        const amount = amountMatch ? parseFloat(amountMatch[0].replace('$', '')) : null;

        if (input.includes('budget')) {
            // ─── FIXED: now uses detectCategory() instead of input.includes(c) ───
            const category = detectCategory(input);
            // ────────────────────────────────────────────────────────────────────
            return { intent: 'SET_BUDGET', category, amount };
        }

        if (amount !== null) {
            // LOG already used the right approach — now both use detectCategory()
            const category = detectCategory(input);
            return { intent: 'LOG', category, amount };
        }

        return { intent: 'UNKNOWN' };
    }

    const chat = document.getElementById('chat-window');

    function addMessage(content, sender, isHTML = false) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        if (isHTML) div.innerHTML = content;
        else div.innerText = content;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function generateSummary() {
        const totals = state.expenses.reduce((acc, curr) => {
            acc[curr.category] = (acc[curr.category] || 0) + curr.amount;
            return acc;
        }, {});

        let html = `<strong>Monthly Progress</strong><div class="status-container">`;
        Object.keys(CATEGORIES).forEach(cat => {
            const spent = totals[cat] || 0;
            const limit = state.budgets[cat] || 0;
            const color = CATEGORIES[cat].color;
            const percent = limit > 0 ? Math.min((spent / limit) * 100, 100) : 0;
            
            html += `
                <div class="progress-row">
                    <div class="progress-label">
                        <span>${cat}</span>
                        <span>$${spent.toFixed(2)} ${limit > 0 ? '/ $' + limit : ''}</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" style="width:${percent}%; background:${color}"></div>
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        return html;
    }

    function handleAction(text) {
        const parsed = parseInput(text);

        switch(parsed.intent) {
            case 'LOG':
                state.expenses.push({ category: parsed.category, amount: parsed.amount, date: new Date() });
                save();
                let msg = `Logged $${parsed.amount.toFixed(2)} to ${parsed.category}.`;
                const catTotal = state.expenses.filter(e => e.category === parsed.category).reduce((s,e)=>s+e.amount, 0);
                if (state.budgets[parsed.category] && catTotal > state.budgets[parsed.category]) {
                    msg += `<br><span style="color:red">⚠️ Over budget for ${parsed.category}!</span>`;
                }
                addMessage(msg, 'bot', true);
                break;

            case 'SET_BUDGET':
                if (parsed.amount) {
                    state.budgets[parsed.category] = parsed.amount;
                    save();
                    addMessage(`Setting your ${parsed.category} budget to $${parsed.amount}.`, 'bot');
                } else {
                    addMessage("I need a number to set a budget! Try: 'Set food budget $300'", 'bot');
                }
                break;

            case 'SUMMARY':
                addMessage(generateSummary(), 'bot', true);
                break;

            case 'UNDO':
                if (state.expenses.length > 0) {
                    const removed = state.expenses.pop();
                    save();
                    addMessage(`Removed last entry: $${removed.amount} in ${removed.category}.`, 'bot');
                } else {
                    addMessage("Nothing left to undo!", 'bot');
                }
                break;

            default:
                addMessage("Hmm, I didn't see an amount or a command I recognize. Try 'Dinner $20' or 'Status'.", 'bot');
        }
    }

    function handleInput(e) {
        e.preventDefault();
        const input = document.getElementById('user-input');
        const val = input.value.trim();
        if(!val) return;
        addMessage(val, 'user');
        input.value = '';
        setTimeout(() => handleAction(val), 400);
    }

    function handleSuggest(text) {
        document.getElementById('user-input').value = text;
        document.getElementById('user-input').focus();
    }

    window.onload = () => {
        addMessage("Hi! I'm your BudgetBot. Tell me what you spent or ask for your 'status' to see your progress.", 'bot');
    };
</script>
</body>
</html>
